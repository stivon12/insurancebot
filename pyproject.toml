[project]
name = "library-claim-agent"
version = "0.1.0"
description = "Live voice+vision agent that inventories, measures and prices a home library for a contents claim"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.1",
    "google-genai>=2.31.0",
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "opencv-python-headless>=5.0.0.93",
    "pillow>=12.3.0",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "rapidfuzz>=3.14.6",
    "uvicorn[standard]>=0.54.0",
]

[project.optional-dependencies]
# Room geometry from Depth Anything 3 (Apache-2.0 DA3-BASE, 0.12 B). Optional: without it the room stage uses the
# gyro + floor-line method only. Pinned commit and dependency list reused from the author's roomscope project.
depth = [
  "torch>=2.3", "torchvision", "huggingface_hub",
  "depth-anything-3 @ git+https://github.com/ByteDance-Seed/Depth-Anything-3@3d835ec1a5802d64a8b8b15f817a1ab54809bfe4",
  "addict", "e3nn", "einops", "evo", "imageio", "moviepy==1.0.3", "omegaconf", "plyfile", "safetensors", "trimesh",
  # tight spine boxes for measurement: open RF-DETR-nano bookshelf detector (pipeline/spine_boxes.py)
  "rfdetr", "supervision",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.uv]
# Depth Anything 3 declares packages that break a Mac install or are never used: xformers (no macOS build),
# pre-commit, and numpy<2 (it runs on numpy 2). Its web/export modules are stubbed in pipeline/da3_worker.py.
override-dependencies = [
  "xformers ; sys_platform == 'never'",
  "pre-commit ; sys_platform == 'never'",
  "gradio ; sys_platform == 'never'",
  "numpy>=1.26",
]

[tool.hatch.metadata]
allow-direct-references = true
