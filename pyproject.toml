[project]
name = "library-claim-agent"
version = "0.1.0"
description = "Live voice+vision agent that inventories, measures and prices a home library for a contents claim"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.1",
    "google-genai>=2.31.0",
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "opencv-python-headless>=5.0.0.93",
    "python-dotenv>=1.2.4",
    "rapidfuzz>=3.14.6",
    "uvicorn[standard]>=0.54.0",
]

[project.optional-dependencies]
# Local models: RF-DETR spine boxes and MoGe-2 room depth (MoGe itself: see README, its metadata pins Linux-only packages).
models = ["torch>=2.3", "torchvision", "huggingface_hub", "pillow", "rfdetr", "scipy", "trimesh"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.hatch.metadata]
allow-direct-references = true
